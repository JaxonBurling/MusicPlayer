[package]
name = "musicplayer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "musicplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Keep these in sync with the @tauri-apps/plugin-* versions in package.json,
# otherwise `tauri dev` refuses to run due to the major/minor version check.
# 关闭默认的 cookies 特性：插件会在 AppData 下打开 `.cookies` 文件，
# 该文件一旦被安全软件/旧进程锁住会导致整个应用在启动阶段崩溃。
# 本项目自身已维护酷狗 / 网易云的 Cookie（localStorage），无需插件 Cookie 存储。
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-media = "0.1.1"
